[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "querypilot"
version = "0.1.0"
description = "Self-correcting text-to-SQL analytics agent"
requires-python = ">=3.10"
dependencies = [
  "sqlglot>=25",
  "pandas",
  "matplotlib",
  "plotly",
  "python-dotenv",
  "anthropic",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
ui = ["streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
